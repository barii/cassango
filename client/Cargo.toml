[package]
name = "cassango-client"
version = "0.1.0"
edition = "2024"
description = "Async Rust driver for the cassango distributed document database"
license = "MIT"

[dependencies]
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order keeps multi-field sort specs ({"a": 1, "b": -1}) in the order written.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# reqwest already runs on tokio; only the timer is used directly (wait_for_index).
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
